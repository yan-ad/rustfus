[workspace]
members = ["crates/rustfus-core", "crates/rustfus-etc"]
default-members = ["crates/rustfus-etc"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
rustfus-core = { path = "crates/rustfus-core" }
iced = { version = "=0.14.0", default-features = false, features = ["wgpu", "tiny-skia", "tokio", "x11", "wayland"] }
shadcn-iced = { version = "=0.3.0", default-features = false, features = ["lucide"] }
rfd = "0.17"
tempfile = "3"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
