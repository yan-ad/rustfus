name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  native:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            runner: ubuntu-24.04
            artifact: rustfus-linux-x86_64
            binary: rustfus
          - name: Linux ARM64
            runner: ubuntu-24.04-arm
            artifact: rustfus-linux-arm64
            binary: rustfus
          - name: macOS ARM64
            runner: macos-15
            artifact: rustfus-macos-arm64
            binary: rustfus
          - name: macOS x86_64
            runner: macos-15-intel
            artifact: rustfus-macos-x86_64
            binary: rustfus
          - name: Windows x86_64
            runner: windows-2025
            artifact: rustfus-windows-x86_64
            binary: rustfus.exe
          - name: Windows ARM64
            runner: windows-11-arm
            artifact: rustfus-windows-arm64
            binary: rustfus.exe

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libdbus-1-dev \
            libegl1-mesa-dev \
            libgbm-dev \
            libgl1-mesa-dev \
            libudev-dev \
            libwayland-dev \
            libxkbcommon-dev \
            pkg-config \
            xorg-dev

      - name: Install Rust 1.92
        uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy with warnings denied
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --all-targets

      - name: Build release binary
        run: cargo build --release --locked

      - name: Collect binary
        shell: bash
        run: |
          mkdir -p artifacts
          cp "target/release/${{ matrix.binary }}" "artifacts/${{ matrix.binary }}"

      - name: Upload portable binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: artifacts/${{ matrix.binary }}
          if-no-files-found: error

  quality:
    name: Core quality checks
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Linux native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libdbus-1-dev \
            libegl1-mesa-dev \
            libgbm-dev \
            libgl1-mesa-dev \
            libudev-dev \
            libwayland-dev \
            libxkbcommon-dev \
            pkg-config \
            xorg-dev

      - name: Install Rust 1.92
        uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: rustfmt, clippy

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy --all-targets -- -D warnings
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test --all-targets
        run: cargo test --all-targets

      - name: Core-only tests without GUI dependencies
        run: cargo test --no-default-features
