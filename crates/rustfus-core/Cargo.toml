[package]
name = "rustfus-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "GUI-independent USB discovery and media configuration for RustFus"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
io-kit-sys = "0.5"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Devices_DeviceAndDriverInstallation", "Win32_Storage_FileSystem", "Win32_System_Ioctl", "Win32_System_IO", "Win32_Security"] }

[dev-dependencies]
tempfile.workspace = true
